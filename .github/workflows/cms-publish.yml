name: Publish managed website
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: koupelni-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read published CMS content
        id: cms
        env:
          KOUPELNI_CMS_TOKEN: ${{ secrets.KOUPELNI_CMS_TOKEN }}
        run: node scripts/cms-sync.mjs
      - name: Keep a versioned copy
        if: steps.cms.outputs.changed == 'true'
        run: |
          git config user.name 'Koupelni CMS'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add predani/web
          if ! git diff --cached --quiet; then
            git commit -m 'Publish approved CMS content'
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.cms.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v4
        if: steps.cms.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: '.'
      - name: Publish Pages
        id: deployment
        if: steps.cms.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
